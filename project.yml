name: MeetingNotes
configs:
  Debug: debug
  Release: release
  Beta: release
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    ARCHS: arm64
    CURRENT_PROJECT_VERSION: 18
    EXCLUDED_ARCHS: x86_64
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/../Frameworks"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: 1.3.0
    MEETINGNOTES_DISPLAY_NAME: 会议记录
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.0.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    minorVersion: 0.12.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  MeetingNotes:
    type: application
    platform: macOS
    sources:
      - MeetingNotes
    info:
      path: Configuration/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenminghao.MeetingNotes
        PRODUCT_NAME: MeetingNotes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MEETINGNOTES_UPDATE_CHANNEL: stable
        MEETINGNOTES_UPDATES_ENABLED: false
        SPARKLE_FEED_URL: https://nakutop.github.io/MeetingNotes/updates/stable/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: ASh1iXHfL1NE8h97OdgLsUzfy42OybuoywwCtRWXDRc=
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: false
          ENABLE_TESTABILITY: true
          OTHER_CODE_SIGN_FLAGS: "--requirements=$(SRCROOT)/Configuration/MeetingNotesRequirements.req"
        Release:
          MEETINGNOTES_UPDATES_ENABLED: true
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: com.shenminghao.MeetingNotes.beta
          PRODUCT_NAME: MeetingNotesBeta
          MEETINGNOTES_DISPLAY_NAME: 会议记录 Beta
          MARKETING_VERSION: 1.3.0
          CURRENT_PROJECT_VERSION: 18
          MEETINGNOTES_UPDATE_CHANNEL: beta
          MEETINGNOTES_UPDATES_ENABLED: true
          SPARKLE_FEED_URL: https://nakutop.github.io/MeetingNotes/updates/beta/appcast.xml
    entitlements:
      path: Configuration/MeetingNotes.entitlements
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: Sparkle
        product: Sparkle
  MeetingNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MeetingNotesTests
    dependencies:
      - target: MeetingNotes
  MeetingNotesUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - MeetingNotesUITests
    dependencies:
      - target: MeetingNotes
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Configuration/MeetingNotesUITests.entitlements
schemes:
  MeetingNotes:
    build:
      targets:
        MeetingNotes: all
    test:
      targets:
        - MeetingNotesTests
        - MeetingNotesUITests
