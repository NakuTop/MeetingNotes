name: Publish signed in-app update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel to publish
        required: true
        type: choice
        options:
          - beta
          - stable
      version:
        description: Expected CFBundleShortVersionString
        required: true
        type: string
      build:
        description: Expected CFBundleVersion
        required: true
        type: string
      release_notes:
        description: Markdown release notes
        required: true
        type: string
      confirmation:
        description: Type PUBLISH beta|stable VERSION (BUILD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-update
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, release, and update one feed
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      REQUESTED_CHANNEL: ${{ inputs.channel }}
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_BUILD: ${{ inputs.build }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      SPARKLE_PUBLIC_ED_KEY: ASh1iXHfL1NE8h97OdgLsUzfy42OybuoywwCtRWXDRc=
      SPARKLE_VERSION: 2.9.2
      SPARKLE_DISTRIBUTION_SHA256: 1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out selected release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate manual release request
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          [[ "$REQUESTED_BUILD" =~ ^[0-9]+$ ]]
          expected_confirmation="PUBLISH $REQUESTED_CHANNEL $REQUESTED_VERSION ($REQUESTED_BUILD)"
          [[ "$RELEASE_CONFIRMATION" == "$expected_confirmation" ]] || {
            echo "Release confirmation text does not match." >&2
            exit 1
          }

          case "$REQUESTED_CHANNEL" in
            beta)
              echo "CONFIGURATION=Beta" >> "$GITHUB_ENV"
              echo "EXPECTED_BUNDLE_ID=com.shenminghao.MeetingNotes.beta" >> "$GITHUB_ENV"
              echo "EXPECTED_FEED_URL=https://nakutop.github.io/MeetingNotes/updates/beta/appcast.xml" >> "$GITHUB_ENV"
              echo "FEED_PATH=updates/beta/appcast.xml" >> "$GITHUB_ENV"
              echo "PRERELEASE=true" >> "$GITHUB_ENV"
              echo "RELEASE_TAG=v${REQUESTED_VERSION}-beta-build${REQUESTED_BUILD}" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=MeetingNotes-${REQUESTED_VERSION}-beta-build${REQUESTED_BUILD}.dmg" >> "$GITHUB_ENV"
              ;;
            stable)
              echo "CONFIGURATION=Release" >> "$GITHUB_ENV"
              echo "EXPECTED_BUNDLE_ID=com.shenminghao.MeetingNotes" >> "$GITHUB_ENV"
              echo "EXPECTED_FEED_URL=https://nakutop.github.io/MeetingNotes/updates/stable/appcast.xml" >> "$GITHUB_ENV"
              echo "FEED_PATH=updates/stable/appcast.xml" >> "$GITHUB_ENV"
              echo "PRERELEASE=false" >> "$GITHUB_ENV"
              echo "RELEASE_TAG=v${REQUESTED_VERSION}" >> "$GITHUB_ENV"
              echo "ARTIFACT_NAME=MeetingNotes.dmg" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported release channel." >&2
              exit 1
              ;;
          esac

      - name: Require protected release secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            [[ -n "${!name:-}" ]] || {
              echo "Missing protected release secret: $name" >&2
              exit 1
            }
          }
          require_secret DEVELOPER_ID_P12_BASE64
          require_secret DEVELOPER_ID_P12_PASSWORD
          require_secret DEVELOPMENT_TEAM
          require_secret APPLE_NOTARY_KEY_ID
          require_secret APPLE_NOTARY_ISSUER_ID
          require_secret APPLE_NOTARY_PRIVATE_KEY
          require_secret SPARKLE_ED_PRIVATE_KEY

      - name: Refuse an existing release or missing Pages branch
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null || {
            echo "gh-pages must be bootstrapped before publishing." >&2
            exit 1
          }

      - name: Prepare temporary Developer ID and notary credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPMENT_TEAM_SECRET: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/meetingnotes-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          notary_profile="MeetingNotes-CI"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" \
            | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning \
            "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -1)"
          [[ -n "$signing_identity" ]] || {
            echo "Developer ID Application identity not found." >&2
            exit 1
          }

          xcrun notarytool store-credentials "$notary_profile" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

          echo "CI_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "CI_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "CI_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_APPLICATION=$signing_identity" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM_SECRET" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN_PROFILE=$notary_profile" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        run: |
          set -euo pipefail
          package_log="$RUNNER_TEMP/meetingnotes-package.log"
          ./Scripts/build_and_package.sh "$CONFIGURATION" | tee "$package_log"
          grep -Fxq "PACKAGE_VALIDATION=PASS" "$package_log"
          grep -Fxq "PUBLISHABLE=YES" "$package_log"
          [[ -f "$GITHUB_WORKSPACE/$ARTIFACT_NAME" ]]
          echo "ARTIFACT=$GITHUB_WORKSPACE/$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Download and verify Sparkle distribution tools
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tools_root="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}"
          curl -fL \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$archive"
          actual_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          [[ "$actual_sha" == "$SPARKLE_DISTRIBUTION_SHA256" ]]
          mkdir -p "$tools_root"
          tar -xf "$archive" -C "$tools_root"
          codesign --verify --strict --verbose=2 \
            "$tools_root/bin/generate_appcast"
          codesign --verify --strict --verbose=2 \
            "$tools_root/bin/sign_update"
          echo "SPARKLE_TOOLS=$tools_root" >> "$GITHUB_ENV"

      - name: Generate signed channel appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          update_dir="$RUNNER_TEMP/meetingnotes-update"
          pages_dir="$RUNNER_TEMP/meetingnotes-pages"
          mkdir -p "$update_dir"
          cp "$ARTIFACT" "$update_dir/$ARTIFACT_NAME"

          gh repo clone "$GITHUB_REPOSITORY" "$pages_dir" -- \
            --branch gh-pages --single-branch
          if [[ -f "$pages_dir/$FEED_PATH" ]]; then
            cp "$pages_dir/$FEED_PATH" "$update_dir/appcast.xml"
            echo "Existing channel feed loaded."
          else
            echo "No existing feed; generating the first channel item."
          fi

          notes_path="$update_dir/${ARTIFACT_NAME%.dmg}.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_path"
          download_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" |
            "$SPARKLE_TOOLS/bin/generate_appcast" --ed-key-file - \
              --download-url-prefix "$download_prefix" \
              --embed-release-notes \
              --maximum-versions 3 \
              "$update_dir"

          appcast_path="$update_dir/appcast.xml"
          [[ -f "$appcast_path" ]]
          expected_download_url="${download_prefix}${ARTIFACT_NAME}"

          derived_public_key="$(swift -e '
            import CryptoKit
            import Foundation
            let encoded = ProcessInfo.processInfo.environment["SPARKLE_ED_PRIVATE_KEY"]!
            let seed = Data(base64Encoded: encoded)!
            let key = try Curve25519.Signing.PrivateKey(rawRepresentation: seed)
            print(key.publicKey.rawRepresentation.base64EncodedString())
          ')"
          [[ "$derived_public_key" == "$SPARKLE_PUBLIC_ED_KEY" ]] || {
            echo "Sparkle private secret does not match the embedded public key." >&2
            exit 1
          }

          signature="$(xmllint --xpath \
            "string((//*[local-name()='enclosure' and @url='$expected_download_url'])[1]/@*[local-name()='edSignature'])" \
            "$appcast_path")"
          [[ -n "$signature" ]]
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" |
            "$SPARKLE_TOOLS/bin/sign_update" --verify --ed-key-file - \
              "$ARTIFACT" "$signature"

          echo "APPCAST_PATH=$appcast_path" >> "$GITHUB_ENV"
          echo "EXPECTED_DOWNLOAD_URL=$expected_download_url" >> "$GITHUB_ENV"
          echo "PAGES_DIR=$pages_dir" >> "$GITHUB_ENV"

      - name: Validate release artifact
        run: |
          set -euo pipefail
          ./Scripts/validate_update_release.sh \
            --configuration "$CONFIGURATION" \
            --artifact "$ARTIFACT" \
            --appcast "$APPCAST_PATH" \
            --expected-version "$REQUESTED_VERSION" \
            --expected-build "$REQUESTED_BUILD" \
            --expected-bundle-id "$EXPECTED_BUNDLE_ID" \
            --expected-feed-url "$EXPECTED_FEED_URL" \
            --expected-public-key "$SPARKLE_PUBLIC_ED_KEY" \
            --expected-download-url "$EXPECTED_DOWNLOAD_URL"

      - name: Retain validated artifact for audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meetingnotes-${{ inputs.channel }}-${{ inputs.version }}-${{ inputs.build }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.APPCAST_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          release_args=(
            --target "$GITHUB_SHA"
            --title "MeetingNotes $REQUESTED_VERSION ($REQUESTED_BUILD)"
            --notes-file "$notes_file"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$ARTIFACT" \
            "${release_args[@]}"

      - name: Publish selected appcast feed
        run: |
          set -euo pipefail
          mkdir -p "$PAGES_DIR/$(dirname "$FEED_PATH")"
          cp "$APPCAST_PATH" "$PAGES_DIR/$FEED_PATH"
          touch "$PAGES_DIR/.nojekyll"
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add "$FEED_PATH" .nojekyll
          git -C "$PAGES_DIR" diff --cached --check
          git -C "$PAGES_DIR" commit \
            -m "Publish $REQUESTED_CHANNEL update $REQUESTED_VERSION ($REQUESTED_BUILD)"
          git -C "$PAGES_DIR" push origin HEAD:gh-pages

      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -n "${CI_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$CI_KEYCHAIN_PATH" || true
          fi
          rm -f \
            "${CI_CERTIFICATE_PATH:-$RUNNER_TEMP/no-certificate}" \
            "${CI_NOTARY_KEY_PATH:-$RUNNER_TEMP/no-notary-key}"
